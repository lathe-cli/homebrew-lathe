name: update-formula

on:
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - homebrew-package-release
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version or tag (defaults to latest)
        required: false
        default: latest
        type: string
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Formula syntax, invariants, and updater tests
        shell: bash
        run: |
          set -euo pipefail
          ruby -c Formula/lathe.rb
          ruby -c scripts/update-formula.rb
          ruby -c test/update_formula_test.rb
          ruby scripts/update-formula.rb --validate --formula Formula/lathe.rb
          ruby test/update_formula_test.rb

      - name: Load Formula with Homebrew when available
        shell: bash
        run: |
          set -euo pipefail
          brew_bin=""
          if command -v brew >/dev/null 2>&1; then
            brew_bin="$(command -v brew)"
          elif [[ -x /home/linuxbrew/.linuxbrew/bin/brew ]]; then
            brew_bin="/home/linuxbrew/.linuxbrew/bin/brew"
          fi
          if [[ -z "$brew_bin" ]]; then
            echo "Homebrew is not installed on this runner."
            exit 0
          fi
          "$brew_bin" ruby -e '
            require "formula"
            f = Formulary::FromPathLoader.new("Formula/lathe.rb").get_formula(:default)
            abort("unexpected formula name: #{f.name}") unless f.name == "lathe"
            abort("invalid formula version: #{f.version}") unless f.version.to_s.match?(/\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z/)
            abort("missing expected stable url: #{f.stable&.url}") unless f.stable&.url&.include?("v#{f.version}/lathe_#{f.version}_")
            abort("missing valid stable checksum") unless f.stable&.checksum&.hexdigest&.match?(/\A[0-9a-f]{64}\z/)
          '

  update:
    needs: validate
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Update Formula/lathe.rb from verified stable release
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_PACKAGE: ${{ github.event.client_payload.package }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          args=(--formula Formula/lathe.rb --github-output "$GITHUB_OUTPUT")
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            target_version="${PAYLOAD_VERSION:-${PAYLOAD_TAG:-}}"
            args+=(--package "${PAYLOAD_PACKAGE:-}" --version "$target_version" --tag "${PAYLOAD_TAG:-}")
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--version "${INPUT_VERSION:-latest}")
          else
            args+=(--version latest)
          fi
          ruby scripts/update-formula.rb "${args[@]}"

      - name: Commit and push Formula update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_TAG: ${{ steps.update.outputs.tag }}
        run: |
          set -euo pipefail
          ruby scripts/update-formula.rb --validate --formula Formula/lathe.rb
          if [[ "$(git diff --name-only)" != "Formula/lathe.rb" ]]; then
            echo "::error::Unexpected modified files before commit"
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lathe.rb
          git commit -s -m "chore(formula): bump lathe to ${TARGET_TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
