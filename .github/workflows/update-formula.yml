name: update-formula

on:
  pull_request:
  repository_dispatch:
    types:
      - homebrew-package-release
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version or tag (defaults to latest)
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Formula syntax and invariants
        shell: bash
        run: |
          set -euo pipefail
          ruby -c Formula/lathe.rb
          ruby -e '
            text = File.read("Formula/lathe.rb")
            ver_match = text.match(/^\s*version\s+"([^"]+)"\s*$/)
            abort("missing version in Formula/lathe.rb") unless ver_match
            ver = ver_match[1]
            semver = /\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z/
            abort("formula version must be stable SemVer: #{ver}") unless ver.match?(semver)
            %w[darwin_arm64 darwin_amd64 linux_arm64 linux_amd64].each do |target|
              url = "https://github.com/lathe-cli/lathe/releases/download/v#{ver}/lathe_#{ver}_#{target}.tar.gz"
              pattern = /url\s+"#{Regexp.escape(url)}"\s*\n\s*sha256\s+"([0-9a-f]{64})"/
              abort("missing or invalid URL/sha256 block for #{target}") unless text.match?(pattern)
            end
          '

  update:
    needs: validate
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Resolve and verify stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_PACKAGE: ${{ github.event.client_payload.package }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            if [[ -n "${PAYLOAD_PACKAGE:-}" && "$PAYLOAD_PACKAGE" != "lathe" ]]; then
              echo "::error::Unexpected package payload: $PAYLOAD_PACKAGE"
              exit 1
            fi
            raw_version="${PAYLOAD_VERSION:-${PAYLOAD_TAG:-}}"
          else
            raw_version="${INPUT_VERSION:-latest}"
            if [[ -z "$raw_version" || "$raw_version" == "latest" ]]; then
              raw_version=$(gh api repos/lathe-cli/lathe/releases/latest --jq '.tag_name')
            fi
          fi

          version="${raw_version#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid or non-stable SemVer version: $raw_version"
            exit 1
          fi

          tag="v${version}"
          release_json=$(gh api "repos/lathe-cli/lathe/releases/tags/${tag}")
          if [[ "$(jq -r '.draft' <<< "$release_json")" != "false" ]]; then
            echo "::error::Refusing draft release: ${tag}"
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' <<< "$release_json")" != "false" ]]; then
            echo "::error::Refusing prerelease: ${tag}"
            exit 1
          fi

          checksums_name="lathe_${version}_checksums.txt"
          assets=$(jq -r '.assets[].name' <<< "$release_json")
          for required in \
            "$checksums_name" \
            "lathe_${version}_darwin_arm64.tar.gz" \
            "lathe_${version}_darwin_amd64.tar.gz" \
            "lathe_${version}_linux_arm64.tar.gz" \
            "lathe_${version}_linux_amd64.tar.gz"; do
            if ! grep -Fxq "$required" <<< "$assets"; then
              echo "::error::Missing release asset ${required} in ${tag}"
              exit 1
            fi
          done

          checksums_path="${RUNNER_TEMP}/${checksums_name}"
          gh release download "$tag" \
            --repo lathe-cli/lathe \
            --pattern "$checksums_name" \
            --output "$checksums_path" \
            --clobber

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "checksums=${checksums_path}"
          } >> "$GITHUB_OUTPUT"

      - name: Render Formula/lathe.rb
        id: render
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.release.outputs.version }}
          CHECKSUMS_PATH: ${{ steps.release.outputs.checksums }}
        run: |
          set -euo pipefail
          ruby -e '
            formula_path = "Formula/lathe.rb"
            target = ENV.fetch("TARGET_VERSION")
            checksums_path = ENV.fetch("CHECKSUMS_PATH")
            github_output = ENV.fetch("GITHUB_OUTPUT")

            current_text = File.read(formula_path)
            current_match = current_text.match(/^\s*version\s+"([^"]+)"\s*$/)
            abort("missing current version in #{formula_path}") unless current_match
            current = current_match[1]

            if current == target
              File.open(github_output, "a") { |f| f.puts("changed=false") }
              exit 0
            end
            if Gem::Version.new(target) < Gem::Version.new(current)
              abort("refusing downgrade from #{current} to #{target}")
            end

            sums = {}
            File.readlines(checksums_path, chomp: true).each do |line|
              next if line.strip.empty?
              parts = line.split(/\s+/, 2)
              next unless parts.length == 2
              digest, name = parts
              sums[name] = digest if digest.match?(/\A[0-9a-f]{64}\z/)
            end

            need = %w[darwin_arm64 darwin_amd64 linux_arm64 linux_amd64].each_with_object({}) do |arch, h|
              asset = "lathe_#{target}_#{arch}.tar.gz"
              digest = sums[asset]
              abort("missing valid sha256 for #{asset}") unless digest
              h[arch] = digest
            end

            rendered = <<~'\''RUBY'\''
              class Lathe < Formula
                desc "Generate agent-friendly Cobra CLIs from API specs"
                homepage "https://github.com/lathe-cli/lathe"
                version "__VERSION__"
                license "Apache-2.0"

                on_macos do
                  if Hardware::CPU.arm?
                    url "https://github.com/lathe-cli/lathe/releases/download/v__VERSION__/lathe___VERSION___darwin_arm64.tar.gz"
                    sha256 "__DARWIN_ARM64__"
                  else
                    url "https://github.com/lathe-cli/lathe/releases/download/v__VERSION__/lathe___VERSION___darwin_amd64.tar.gz"
                    sha256 "__DARWIN_AMD64__"
                  end
                end

                on_linux do
                  if Hardware::CPU.arm?
                    url "https://github.com/lathe-cli/lathe/releases/download/v__VERSION__/lathe___VERSION___linux_arm64.tar.gz"
                    sha256 "__LINUX_ARM64__"
                  else
                    url "https://github.com/lathe-cli/lathe/releases/download/v__VERSION__/lathe___VERSION___linux_amd64.tar.gz"
                    sha256 "__LINUX_AMD64__"
                  end
                end

                def install
                  bin.install "lathe"
                end

                test do
                  assert_match version.to_s, shell_output("#{bin}/lathe version")
                end
              end
            RUBY

            rendered = rendered
              .gsub("__VERSION__", target)
              .gsub("__DARWIN_ARM64__", need.fetch("darwin_arm64"))
              .gsub("__DARWIN_AMD64__", need.fetch("darwin_amd64"))
              .gsub("__LINUX_ARM64__", need.fetch("linux_arm64"))
              .gsub("__LINUX_AMD64__", need.fetch("linux_amd64"))

            File.write(formula_path, rendered)
            File.open(github_output, "a") { |f| f.puts("changed=true") }
          '
          ruby -c Formula/lathe.rb

      - name: Commit and push Formula update
        if: steps.render.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lathe.rb
          git commit -s -m "chore(formula): bump lathe to ${TARGET_TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
